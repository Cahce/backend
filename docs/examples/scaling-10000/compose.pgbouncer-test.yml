# Isolated lab only; ports bound to loopback and PostgreSQL data is ephemeral.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: pooler_test
      POSTGRES_DB: pooler_test
      POSTGRES_PASSWORD: ${POOLER_TEST_PASSWORD:?run prepare-pgbouncer-lab.mjs first}
    command: [postgres, -c, max_connections=50]
    ports: ['127.0.0.1:15432:5432']
    tmpfs: ['/var/lib/postgresql/data:size=512m']
    healthcheck:
      test: [CMD, pg_isready, -U, pooler_test, -d, pooler_test]
      interval: 2s
      timeout: 2s
      retries: 30
    networks: [pooler-lab]
  pgbouncer:
    build: ../../../../deploy/pgbouncer
    image: tlu-pgbouncer:1.26.0
    depends_on:
      postgres: { condition: service_healthy }
    ports: ['127.0.0.1:16432:6432']
    volumes:
      - ${PGBOUNCER_LAB_INI:?run prepare-pgbouncer-lab.mjs first}:/etc/pgbouncer/pgbouncer.ini:ro
    secrets: [pgbouncer_users]
    read_only: true
    tmpfs: ['/run/pgbouncer:size=4m,mode=0700', '/tmp:size=8m']
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    ulimits:
      nofile: { soft: 4096, hard: 4096 }
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -p, '6432', -U, pooler_test, -d, pooler_test]
      interval: 2s
      timeout: 2s
      retries: 30
    networks: [pooler-lab]
    stop_grace_period: 15s
secrets:
  pgbouncer_users:
    file: ${PGBOUNCER_LAB_AUTH_FILE:?run prepare-pgbouncer-lab.mjs first}
networks:
  pooler-lab: {}
