; REFERENCE ONLY: mount real SCRAM credentials and TLS certificates as secrets.
; Two poolers with max_db_connections=60 => at most 120 connections for scholar,
; PLUS direct listeners/workers/ops. Recalculate across ALL databases/users.
[databases]
scholar = host=postgres-primary.internal port=5432 dbname=scholar

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
pool_mode = transaction
auth_type = scram-sha-256
auth_file = /run/secrets/pgbouncer-users.txt
max_client_conn = 1000
default_pool_size = 40
reserve_pool_size = 5
reserve_pool_timeout = 2
max_db_connections = 60
max_prepared_statements = 200
query_wait_timeout = 5
server_connect_timeout = 5
server_idle_timeout = 60
server_lifetime = 3600
client_tls_sslmode = require
client_tls_cert_file = /run/secrets/pooler.crt
client_tls_key_file = /run/secrets/pooler.key
server_tls_sslmode = verify-full
server_tls_ca_file = /run/secrets/postgres-ca.crt
; LISTEN and migrations MUST use separate direct/session connections.
; Do not add a session reset workaround to make LISTEN use this endpoint.
