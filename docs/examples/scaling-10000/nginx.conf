# REFERENCE ONLY: internal HTTP listener behind a TLS terminator.
# Deploy after shared tickets/revocation/jobs/files and graceful drain are ready.
worker_processes auto;
worker_rlimit_nofile 65535;
events { worker_connections 16384; }
http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }
    upstream scholar_api {
        least_conn;
        server api-1:3000 max_fails=3 fail_timeout=10s;
        server api-2:3000 max_fails=3 fail_timeout=10s;
        keepalive 128;
        keepalive_timeout 60s;
    }
    server {
        listen 8080;
        client_header_timeout 15s;
        client_body_timeout 30s;
        # Envelope allows the existing 50 MiB multipart payload plus framing.
        # Fastify still enforces its JSON1MiB / route-specific multipart limits.
        client_max_body_size 52m;
        keepalive_timeout 65s;
        # Scrape each API on the private network using METRICS_TOKEN.
        location = /metrics { return 404; }
        location / {
            proxy_pass http://scholar_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # Replace untrusted incoming XFF; configure trusted ingress chain separately.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_connect_timeout 3s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_buffering off;
            # Bound request body buffering with Nginx temp-disk quotas in deployment.
            proxy_request_buffering on;
            # Do not automatically replay writes to another instance.
            proxy_next_upstream off;
        }
    }
}
